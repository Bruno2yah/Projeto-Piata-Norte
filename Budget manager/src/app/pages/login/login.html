<div class="pagina-auth pagina-login">

  <aside class="painel-imagem" aria-label="Imagem da Marcenaria Piata Norte">
    <img
      src="/assets/imagem-login.jpg"
      alt=""
      class="imagem-painel">
  </aside>

  <main class="area-formulario">
    <div class="caixa-formulario">

      <a class="link-voltar-site" href="/">
        ← Voltar ao site
      </a>

      <div class="titulo-formulario">
        <h1>Bem-vindo de volta!</h1>
        <p>Entre com seus dados para acessar sua conta.</p>
      </div>

      <form class="formulario">

        <div class="campo">
          <label class="campo-rotulo" for="login-email">
            E-mail
          </label>

          <input
            class="campo-entrada"
            id="login-email"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email">
        </div>

        <div class="campo">

          <div class="campo-rotulo-linha">
            <label class="campo-rotulo" for="login-senha">
              Senha
            </label>

            <button
              class="link-esqueci-senha"
              type="button">
              Esqueci minha senha
            </button>
          </div>

          <div class="campo-com-botao">

            <input
              class="campo-entrada"
              id="login-senha"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password">

            <button
              class="botao-mostrar-senha"
              type="button"
              aria-controls="login-senha">
              Mostrar
            </button>

          </div>

        </div>

        <button
          class="botao botao-vermelho botao-grande botao-largura-total"
          type="button">
          Entrar na minha conta
        </button>

        <p class="chamada">
          Não tem conta?
          <a href="/cadastro">Cadastre-se grátis</a>
        </p>

      </form>

    </div>
  </main>

</div>
