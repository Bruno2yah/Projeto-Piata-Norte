<div class="pagina-auth pagina-cadastro">

  <aside class="painel-imagem" aria-label="Imagem da Marcenaria Piata Norte">
    <img
      src="/assets/imagem-cadastro.jpg"
      alt=""
      class="imagem-painel"
    >
  </aside>

  <main class="area-formulario">
    <div class="caixa-formulario">

      <a class="link-voltar-site" href="/">
        ← Voltar ao site
      </a>

      <div class="titulo-formulario">
        <h1>Criar minha conta</h1>
      </div>

      <form class="formulario">

        <div class="linha-dois-campos">

          <div class="campo">
            <label class="campo-rotulo" for="cadastro-nome">
              Nome
            </label>

            <input
              class="campo-entrada"
              id="cadastro-nome"
              type="text"
              placeholder="Seu primeiro nome"
              autocomplete="given-name">
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="cadastro-sobrenome">
              Sobrenome
            </label>

            <input
              class="campo-entrada"
              id="cadastro-sobrenome"
              type="text"
              placeholder="Sobrenome"
              autocomplete="family-name">
          </div>

        </div>

        <div class="campo">
          <label class="campo-rotulo" for="cadastro-email">
            E-mail
          </label>

          <input
            class="campo-entrada"
            id="cadastro-email"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email">
        </div>

        <div class="linha-dois-campos">

          <div class="campo">
            <label class="campo-rotulo" for="cadastro-senha">
              Crie uma senha
            </label>

            <input
              class="campo-entrada"
              id="cadastro-senha"
              type="password"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password">
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="cadastro-confirmar-senha">
              Confirme a senha
            </label>

            <input
              class="campo-entrada"
              id="cadastro-confirmar-senha"
              type="password"
              placeholder="Repita sua senha"
              autocomplete="new-password">
          </div>

        </div>

        <label class="caixa-termos" for="aceitar-termos">

          <input
            type="checkbox"
            id="aceitar-termos">

          <span>
            Li e aceito os
            <a href="#termos-de-uso">Termos de uso</a>
            e a
            <a href="#politica-de-privacidade">Política de privacidade</a>
          </span>

        </label>

        <button
          class="botao botao-vermelho botao-grande botao-largura-total"
          type="button">
          Criar minha conta grátis
        </button>

        <p class="chamada">
          Já tem uma conta?
          <a href="/login">Entrar</a>
        </p>

      </form>

    </div>
  </main>

</div>
